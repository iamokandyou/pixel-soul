/* ============================================================================
 * 《像素战魂》· Poki 提交入口页
 * ----------------------------------------------------------------------------
 * 这是**提交给门户的那一页**，不是本地运行页。三处关键差别，每一处都对应
 * 一条门户的准入要求：
 *
 *   1. 没有任何调试 UI。本地运行页的页脚按钮、状态条、指纹、模块计数
 *      在这一页里全部不存在 —— Poki 的 QA 会看玩家看到的东西，
 *      一行「视口 836×470 · 指纹 3f2a」就够把游戏判成「未完成的开发者版本」。
 *
 *   2. 画布铺满视口（scale to cover）。Poki 把它嵌在一个固定比例的容器里，
 *      官方原话是必须 scale to cover —— 留黑边会被直接判不过。
 *      这里用 max(宽比, 高比) 放大并居中，溢出的部分由 overflow:hidden 吃掉。
 *
 *   3. 方向锁死横屏。引擎支持横竖屏，但门户的容器永远是横的：
 *      留一个永远触发不了的方向只会让玩家在错误的方向上耗时间。
 *
 * 页面本身**没有样式表、没有外部字体、没有图标**，唯一的资源请求是 Poki
 * 的 SDK 脚本 —— 那是门户自己要求的，不算「外部依赖」。
 * ==========================================================================*/
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #10141C;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
/* 居中 + 溢出裁掉：这既是 Poki 要的 cover 行为，也让「容器比例与 16:9

#game {
  display: block; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  touch-action: none; outline: none;
}
</style>

 * 唯一真相源 · 角色几何与数值
 * ----------------------------------------------------------------------------
 * 设计方案 §03 的硬约束：三套渲染器共用这一份数据，谁都不许改。
 *   bones   —— 骨架关键点（逻辑坐标，原点在角色脚底中心，y 向上为负）
 *   palette —— 颜色语义（渲染器自行解释：像素风做调色板量化，卡通风做描边）
 *   数值    —— 移速 / 跳跃 / 翻滚无敌帧 / 开火间隔，与画风完全无关
 * tests/run.js 会深冻结这份对象并校验：切画风前后逐字段一致。
 *
 * 【角色档案 FIGHTERS】人类 / 猫 / 狗三个可玩角色。
 * 与 L1 引擎的关系：L1 从照片判出 species（cat / dog / unknown），
 * fighterFor() 把 species 映射成角色档案 —— 这是「照片 → 可玩角色」的接缝点，
 * 也是「猫打鱼骨、狗打骨头」这条规则的落地点。
 * 红线：三个角色的碰撞盒 / 移速 / 伤害完全一致，只换外观与弹形。
 *       否则菜单里就会出现「最优角色」，也会让「切画风不改变玩法」形同虚设。
 * ==========================================================================*/

var P = require('./prims');

var HERO = {
  collision: { w: 26, h: 40 },     // 碰撞盒：左上角锚定，渲染器不得放大或缩小
  moveSpeed: 240,                  // px/s
  jumpVelocity: -620,              // px/s（y 轴向下为正）→ 跳跃顶点 620²/(2×1800) ≈ 107px
  gravity: 1800,
  /* 起跳 / 落地保护（秒）。这是被探针量出来的数，不是手感。
   *
   * 背景：跳跃的碰撞盒要**必然穿过**所有弹道高度 —— 身体从 0 升到 107px，
   * 不可能不经过 20~25px 那条线。所以「跳跃途中被打」本身躲不掉，问题只在
   * 窗口有多长、落在哪。实测（tools/diag-jump-hit.js）：对地面敌人这个窗口
   * 只有 5 帧 / 0.083s，但它**分在两端** —— 起跳的头 2~3 帧和落地的末 2~3 帧。
   * 也就是说，玩家「刚起跳」和「刚落地」这两个瞬间是被罚的。
   *
   * 更致命的是时机窗口：子弹飞行约 2s，玩家必须在**到达前 0.03~0.63s** 之间
   * 起跳才安全。人判不准这个区间，所以实测「见弹就跳」的空中挨打是 0 次、
   * 挨打**全部发生在地面** —— 玩家跳早了，落地那一刻子弹才到。
   *
   * 所以给两端各 0.10s（6 帧）无敌：起跳端容忍「跳早了」，落地端容忍
   * 「跳晚了」。这不改变几何（该穿过的还是要穿过），只是不再惩罚那两个瞬间。
   * 上限的约束：0.10 + 0.10 = 0.20s < 滞空 0.667s，全程无敌做不到；
   * 真正的制衡是**跳跃期间火力空转**（93% 的滞空打不到地面敌人，见同一探针
   * 的【3】），无脑连跳会被敌人堆死，所以不用额外限制。 */
  jumpGuard: 0.10,
  /* 翻滚无敌帧 0.16 → 0.30 → 0.34。这几个数都是被不等式夹出来的，不是手感的产物。
   *
   * 【下限一】无敌帧必须长于「子弹穿过身体」的时间
   *     穿身时间 = (碰撞盒宽 + 子弹宽) / 子弹速度，站着不动时：
   *         步兵弹 (26+12)/220 = 0.172s　炮台弹 (26+12)/180 = 0.211s
   *     最早写的 0.16s **比这个还短**：子弹在你身体里的时候无敌帧就到期了，
   *     而穿身而过的子弹**不会**被消耗（没命中就不销毁），于是它留在身体里，
   *     无敌帧一失效立刻结算伤害。实测 13 种起手时机、13 次全被打中 ——
   *     玩家看到的是「子弹从身上穿过去，然后自己掉血」，翻滚等于没翻滚。
   *
   * 【下限二】无敌帧必须长于「敌人一轮连发的跨距」
   *     跨距 = (连发数 − 1) × 连发间隔。炮台 3 连发 × 0.14 = 0.28s（0.30 覆盖得住），
   *     但精英 3 连发 × 0.16 = 0.32s —— 0.30 差 0.02s，那一串激光的**第三发
   *     必然在无敌帧结束之后到**，而且精英是全场唯一伤害 2 的敌人。
   *     两条下限取大：max(0.211, 0.32) + 一帧余量 0.0167 + 收尾缓冲 → 0.34s。
   *     tests/run.js 用数值表把这两条不等式逐类型重算一遍，改坏立刻变红。
   *
   * 【冷却】0.90 → 0.80，同样是推出来的：
   *     玩家最顺手的连招是「翻滚 → 起跳 → 落地 → 再翻滚」，长度 = 0.16 + 0.689 = 0.849s。
   *     冷却必须 ≤ 这个长度，落地那一刻才滚得出来。原来的 0.90 比它长 0.051s ——
   *     不多，但**每一次循环都会撞上**：正好卡在「有时按得出、有时按不出」的临界，
   *     玩家感到的就是「落地后不能立即翻滚」。0.80 留出 0.049s 余量。
   *     （冷却从**起手**计时，所以真正的恢复时间是 0.80 − 0.16 = 0.64s。）
   *
   * tests/run.js 三条不等式各自验一条：cd ≤ roll+airtime、iframes ≥ 最长连发跨距、
   * iframes ≥ 最坏穿身时间。 */
  dash: { speed: 640, time: 0.16, cooldown: 0.80, iframes: 0.34 },

  /* ── 可进化技能：净化屏障 ────────────────────────────────────────────────
   * 需求原话：「在一定的时间内，生成一道可以消灭当前可见画面中的所有小怪的
   * 屏障，屏障是蓝色的」，并且技能可以进化。
   *
   * 四个数在这里一次定死，玩法层只读不写：
   *   charge —— 充能周期（秒），满了进入「就绪」
   *   speed  —— 屏障推进速度（px/s）
   *   life   —— 屏障存活时间（秒）
   *   w      —— 屏障厚度（px）
   *
   * 【不等式①：扫得完整个可见画面】speed × life ≥ 最大屏宽 + w
   *   逻辑视口只有两档 —— 竖屏 390、横屏 844（src/core/layout.js），最坏是横屏。
   *   Lv1 一道屏障活 0.80s、走 1400px/s ⇒ 覆盖 1120px ≥ 844 + 26 = 870px。
   *   **必须按 844 算而不是 390**：按竖屏调参数，横屏玩家就会看到屏障在飞到
   *   屏幕右缘之前消失，右边的小怪漏掉一半 —— 而「消灭**当前可见画面**中的
   *   所有小怪」这句话，横屏的可见画面正好是 844 宽。
   *
   * 【不等式②：不许叠层】charge ≥ life
   *   充能比屏障存活还短，场上就会同时挂着两道屏障 —— 那既不是「一道」，
   *   强度也凭空翻倍。最小 charge 7s 远大于最大 life 1.0s，留了 7 倍余量。
   *
   * 【进化按「释放次数」】每 castsPerLevel 次释放升一级，1 → 5 级，三个数一起涨：
   *   充能 11 → 7s、推进 1400 → 2000px/s、厚度 26 → 44px（Lv5 是 Lv1 的 3.0 倍）。
   *   「一局到底走不走得完」是探针量出来的（tools/diag-skill.js）：75 秒的关卡里
   *   首充 11s ⇒ 第 8 次释放落在 71s，刚好走完 5 级。若首充 ≥ 12s，玩家打到
   *   通关还停在 Lv1 —— 那时「进化」这条设计等于没做（这是第一版参数被探针
   *   打回来的原因，12/11/10/9/8 就是那么废掉的）。
   *
   * 【就绪之后为什么还有个 autoAfter】需求里「玩家点技能键放」和「每隔一段时间
   *   自动来一道」是两句话，调和方式是：充能满 → 进入就绪，玩家可以按技能键
   *   自己挑时机放；若就绪后 autoAfter 秒还没人按，就自动放掉。
   *   探针【3b】给这一行的支持是实打实的：同一条命（见弹就跳、真血 3 条），
   *   「一到点就放」活 38.9s，而「攒着等凑够 2 只再放」只活 22.3s ——
   *   和**完全不放**一模一样。攒着不放等于技能不存在，所以「自动兜底」
   *   不是偷懒，是防呆；而 2.0s 这个长度取的是「够玩家反应过来按一下，
   *   又不至于把一次节奏拖成两次」。
   *
   * 颜色不在这里：屏障必须是蓝的（需求），但「哪个蓝」是画风的事 ——
   * 三套皮各自解释，取值都落在 tables.PALETTE.blue / blueDark 上。 */
  skill: {
    /* 展示名走 i18n（见 src/data/i18n.js 顶部）。剩下的是纯数值，与语言无关 ——
     * 这也是「一份数据」该有的样子：语言是**呈现**，不是数值。 */
    nameKey: 'skill.name',
    autoAfter: 2.0,                 // 就绪后多久没人按就自动放
    castsPerLevel: 2,               // 每释放 2 次升 1 级
    levels: [
      { charge: 11, speed: 1400, life: 0.80, w: 26 },
      { charge: 10, speed: 1550, life: 0.85, w: 30 },
      { charge: 9, speed: 1700, life: 0.90, w: 34 },
      { charge: 8, speed: 1850, life: 0.95, w: 38 },
      { charge: 7, speed: 2000, life: 1.00, w: 44 }
    ]
  },

  fireInterval: 0.12,              // 自动开火间隔（秒）

  bones: {
    // 头部半径 13（原来 10）：蜡笔小新的头本来就大，而且脸上要同时放下
    // 粗眉、圆眼、吻部 —— r=10 时眉眼挤成一条黑带，这是实际踩过的坑。
    // 碰撞盒不变（26×40）：头只是外观，头部不参与判定。
    head: { x: 0, y: -34, r: 13 },
    torso: { x: 0, y: -18, w: 18, h: 20 },
    armBack: { x: -9, y: -22, len: 14, angle: 1.15 },   // 弧度，0 = 正右方
    armFront: { x: 9, y: -22, len: 16, angle: -0.35 },
    gun: { x: 17, y: -18, len: 15 },
    legBack: { x: -5, y: 0, len: 18, angle: 0.15 },
    legFront: { x: 5, y: 0, len: 18, angle: -0.12 }
  },

  palette: {
    skin: '#F2C9A0', skinShade: '#D9A87C',
    hair: '#2A2620',
    suit: '#FF5A3C', suitDark: '#C9412B',
    accent: '#2ED8A7',
    gun: '#3A3F4B',
    outline: '#12111A'
  }
};

/* ---------------------------------------------------------------------------
 * 宠物部件（耳朵 / 吻部 / 胡须 / 尾巴）
 * 只定义**几何**，颜色一律从传入的 palette 取 —— 一份几何一份配色，
 * 不允许在几何里硬编码颜色，否则改配色要改两处。
 * 坐标与 HERO.bones 同一坐标系：原点在脚底中心，y 向上为负。
 * 头部骨骼在 (0,-34) 半径 13，所以头顶 y=-47、头侧 x=±13。
 *
 * 【宠物不像宠物——2026-10 重设计的由来】faces-zoom 4× 目检的结论：
 *   旧版猫狗 = 人类的头 + 贴上去的小零件。三个具体的「不像」：
 *   ① 狗的垂耳整只画在头圆**里面**（最远点距圆心 12.4 < r13）—— 轮廓一动
 *      不动，furDark 色块叠在同色圆上，目检两轮都认成脸上的色斑；
 *   ② 猫的反侧胡须只有 8px 长、整根都在脸颊里 —— 看起来是抓痕不是胡须；
 *   ③ 猫的嘴是两道横穿吻部的深色口线 —— 4× 下就是两块脏斑。
 *   重设计的三条判据（tests/run.js 五官一节锁死，改回去会变红）：
 *   A. 垂耳至少一个顶点**伸出头轮廓以外**（距圆心 > r + 0.5）；
 *   B. 猫耳尖高出头顶 ≥ 8px（旧版 6.6px，4× 下耳朵仍像帽子装饰）；
 *   C. 胡须的远端必须伸出头轮廓以外 —— 胡须是「从脸上长出来的」，不是「画在脸上」。
 * -------------------------------------------------------------------------*/

/* 猫头部件：尖三角耳 + 小吻部 + ω 嘴 + 吻侧胡须。
 *
 * 【坐标系在 2026-10 改过一次】旧版是**绝对坐标**，头钉在 (0,-34)、半径 13，
 * 于是耳朵/胡须的形状里写死了「头在哪」。但爬行姿态的头在 (15,-21)、半径 12 ——
 * 旧写法要么把零件留在原地（猫耳朵长在屁股上方），要么整份复制一遍。
 * 现在以**头心为原点**，placeAtHead() 按头半径缩放后平移到头心：
 * 同一份零件能贴到任何一个头上，而零件的**形状**不必重画第二份。
 * 半径 13 是这套零件被设计时的基准（PET_HEAD_UNIT），缩放系数 = 头半径 / 13。
 *
 * 三条「不像宠物」的判据仍然由 tests/run.js 锁着（A 耳破轮廓 / B 耳尖高出
 * 头顶 ≥ 8px / C 胡须远端伸出轮廓）—— 注意 B：耳朵高出头顶的量会**随着
 * 头的缩放一起缩小**（9.5px @r13 → 8.8px @r12），所以爬行头的半径不能更小。 */
function catParts(pal) {
  var F = pal.fur, FD = pal.furDark, IN = pal.inner, ED = pal.furEdge, BE = pal.belly;
  var L = [];
  // 耳：尖三角 —— 与狗的垂耳第一眼就能分开（L1 引擎的 earSharp 判据说的正是这两个形状）。
  // 耳尖 (±7.5,-24.5) 在基准半径 13 的坐标系里比头顶 (-13) 高出 11.5px。
  // （2026-10 爬行姿态再加长 2px：俯角 0.25rad 把右耳向前下方扫，
  //  原来的 -22.5 在爬行头上只高出头顶 7.5px < 8 —— tests/run.js 判据 B 变红。
  //  判据验的是**画出来的**耳朵，所以改零件而不是改判据。）
  L.push(P.poly([[-11.5, -8.0], [-3.0, -9.5], [-7.5, -24.5]], 'ear', F));
  L.push(P.poly([[3.0, -9.5], [11.5, -8.0], [7.5, -24.5]], 'ear', F));
  L.push(P.poly([[-9.4, -9.2], [-4.8, -10.0], [-7.3, -20.8]], 'earInner', IN));
  L.push(P.poly([[4.8, -10.0], [9.4, -9.2], [7.3, -20.8]], 'earInner', IN));
  // 吻部：小而圆（muzzleRatio 低），粉色三角鼻是猫脸第二识别点 —— 要大得
  // 在 1× 也读得出来（4× 目检：小鼻头会被吻部圆的颗粒纹吃掉）。
  // 刻意放在头心**下方**：眼睛要留在吻部上方，不能糊在一起。
  L.push(P.circle(8.2, 3.4, 4.2, 'muzzle', BE));
  L.push(P.poly([[9.6, 0.2], [12.8, 0.2], [11.2, 2.6]], 'nose', IN));
  // ω 嘴：鼻下两短笔拼一个「ω」，替代旧版两道横穿吻部的深色口线
  L.push(P.capsule(9.3, 4.1, 11.2, 2.9, 0.9, 'mouth', ED));
  L.push(P.capsule(11.2, 2.9, 13.1, 4.1, 0.9, 'mouth', ED));
  // 胡须：只留吻侧（朝向那侧）三根，**根须从吻部边缘长出**（旧版根在吻部圆
  // 里面，4× 目检像吻部被抓伤）、远端距头心 20.8~21.6 明确伸出头轮廓（判据 C）。
  // 反侧三根整根删掉：¾ 视角里它们只能横穿脸颊，怎么画都像抓痕。
  L.push(P.capsule(11.8, 1.4, 20.8, -0.9, 0.7, 'whisker', ED));
  L.push(P.capsule(12.2, 2.3, 21.6, 2.1, 0.7, 'whisker', ED));
  L.push(P.capsule(11.8, 3.2, 20.8, 5.0, 0.7, 'whisker', ED));
  return L;
}

/* 猫尾：从髋部向后上卷 —— 猫的招牌。root 由姿势给（直立是臀、爬行是髋），
 * 两种卷法各一套相对坐标：直立时尾巴从臀部往上翘；爬行时身体是水平的，
 * 尾巴从髋部向后卷起（猫走路时那根竖着的旗杆）。 */
function catTail(pal, root, kind) {
  var F = pal.fur, FD = pal.furDark;
  var r = root || { x: -8, y: -12 };
  if (kind === 'crawl') {
    /* 爬行时从髋部向后上卷成一面旗。**高度不是审美**：碰撞盒顶（-40）在爬行
     * 姿态里只剩耳朵和尾巴够得着（头被嘴的高度锁死在 -37.7），尾巴尖够不到
     * 就会让包围盒短一截 —— 红线十二第一条验的就是这个。 */
    return [
      P.capsule(r.x, r.y, r.x - 5, r.y - 7, 3.4, 'tail', F),
      P.capsule(r.x - 5, r.y - 7, r.x - 3, r.y - 15, 3.0, 'tail', F),
      P.capsule(r.x - 3, r.y - 15, r.x + 3, r.y - 21, 2.6, 'tail', F),
      P.circle(r.x + 4.5, r.y - 22.6, 1.9, 'tailTip', FD)
    ];
  }
  return [
    P.capsule(r.x, r.y, r.x - 7, r.y - 5, 3.4, 'tail', F),
    P.capsule(r.x - 7, r.y - 5, r.x - 11, r.y - 15, 3.0, 'tail', F),
    P.capsule(r.x - 11, r.y - 15, r.x - 8, r.y - 25, 2.6, 'tail', F),
    P.circle(r.x - 8, r.y - 26.2, 1.9, 'tailTip', FD)
  ];
}

/* 狗头部件：垂耳 + 突出的大吻部 + 吐舌头（不画胡须 —— whisker=0）。
 * 坐标系与猫同：头心为原点，半径 13 为基准。 */
function dogParts(pal) {
  var FD = pal.furDark, IN = pal.inner, ED = pal.furEdge, BE = pal.belly, NO = pal.nose;
  var L = [];
  // 耳：垂耳 —— 用**胶囊**（圆头粗笔画）而不是四边形：4× 目检过两版四边形
  // 耳（额头对称灰斑 / 对称侧挂灰斑），棱角 + 颗粒纹叠出来都像脸上的补丁；
  // 圆头粗笔画天然带耳朵的浑圆感，三套渲染器都能画 capsule。
  // 近耳（朝向那侧）从头顶挂到头侧，外端距头心 15.0 伸出轮廓（判据 A）；
  // 远耳从头缘后面探出，只露出挂在外面的那条。
  // 外耳用 furDark 压深一档，垂耳的层次才读得出来 —— 踩过。
  // 眼睛画在部件之后（drawFace 在 paint 后跑），压住远耳内侧属正常遮挡。
  L.push(P.capsule(4.5, -7.5, 13.5, 6.5, 7.5, 'ear', FD));
  L.push(P.capsule(-8.5, -7.5, -16.5, 5.5, 5.5, 'ear', FD));
  // 吻部：比猫更长更突出（muzzleRatio 高）—— 吻圆 + 前伸的口鼻 + 深色大鼻头。
  // 鼻头中心 (17,1.8) 距头心 17.1、前缘 19.8：整个鼻头悬在头轮廓外、
  // 嵌在吻圆右缘上 —— 「狗的鼻子是凸出来的」在轮廓上成立（第一版鼻头
  // 与吻圆只搭 0.6px，4× 目检像一块悬浮的黑斑）。
  L.push(P.circle(8.6, 3.2, 4.6, 'muzzle', BE));
  L.push(P.circle(14.4, 2.4, 3.4, 'snout', BE));
  L.push(P.circle(17.0, 1.8, 2.7, 'nose', NO));
  // 嘴线 + 垂下的舌头（舌头下缘在头心下方 9.8，已伸出头部下轮廓；
  // 舌头要够宽 —— 4× 目检：窄舌头会被颗粒纹吃掉，看不出「吐舌头」）
  L.push(P.capsule(15.4, 4.2, 9.4, 6.0, 0.9, 'mouth', ED));
  L.push(P.poly([[11.0, 5.2], [14.6, 4.6], [14.0, 9.8], [11.6, 9.3]], 'tongue', IN));
  return L;
}

/* 狗尾：短而翘。爬行时从髋部向后翘一小截（不像猫那样竖成旗杆）。 */
function dogTail(pal, root, kind) {
  var F = pal.fur, FD = pal.furDark;
  var r = root || { x: -8, y: -13 };
  if (kind === 'crawl') {
    /* 同样是「必须够到碰撞盒顶」逼出来的：狗的垂耳是往下挂的，爬行姿态里
     * 狗的轮廓比猫还矮，只剩尾巴能顶到 -40 那条线。卷起来的尾巴也是狗
     * 高兴时的样子，不算勉强。 */
    return [
      P.capsule(r.x, r.y, r.x - 4, r.y - 8, 3.6, 'tail', F),
      P.capsule(r.x - 4, r.y - 8, r.x + 0.5, r.y - 18, 3.2, 'tail', F),
      P.circle(r.x + 1.2, r.y - 19.6, 2.3, 'tailTip', FD)
    ];
  }
  return [
    P.capsule(r.x, r.y, r.x - 5.5, r.y - 9, 3.6, 'tail', F),
    P.circle(r.x - 5.8, r.y - 10.4, 2.3, 'tailTip', FD)
  ];
}

/* ---------------------------------------------------------------------------
 * 四足爬行姿态（CRAWL）—— 猫狗的骨架
 * ---------------------------------------------------------------------------
 * 「把猫和狗做成在地上爬行的动画」这句话里，**爬行换的是骨架**，不是一个
 * 旋转、也不是一个缩放能表达的：人类的骨架是两条腿站着 + 两条臂端枪，
 * 猫狗的骨架是四条腿趴着 + 一张嘴。所以这一段独立成一份几何，而不是给
 * heroFigures 多加几个参数 —— 两者除了「都归同一个角色档案管」之外没有
 * 共同结构。
 *
 * 【与碰撞盒的关系】碰撞盒仍然是 26×40，三个角色逐字段相同（红线：只换
 * 外观与弹形）。代价是画出来的形状不再和盒子逐点吻合，所以约束换成
 * 「**包围盒必须盖住碰撞盒**」—— 由 tests/run.js 红线十二逐角色校验。
 * 少了这条，就会出现这个工程最不能接受的那类 bug：看着没碰到却掉血
 * （反过来「碰到了却没掉血」会让人以为判定坏了，一样糟）。
 *
 * 盒高 40px 是硬指标：爬行是**低姿态**，最容易被画成一只贴在地上的薄片，
 * 那样盒子上半截 20px 就成了「打得到却看不见」的空区。这里的做法是把
 * 竖向张力交给三个东西撑住 —— 立起来的耳朵（到 -41.8）、翘起的尾巴、
 * 抬头的吻部，它们的包围盒正好压过 -40 那条线。
 * -------------------------------------------------------------------------*/

/* 头部件被设计时的基准半径：猫狗的耳朵/胡须/吻部都按 r=13 画的，
 * 贴到别的头上时按 头半径 / 13 缩放（见 placeAtHead）。 */
var PET_HEAD_UNIT = 13;

var CRAWL = {
  /* 头：在前、在低位。这三个数不是随手写的 —— 它们被三条约束一起夹出来：
   *
   * ① 吐弹高度。弹必须从嘴里出来，而三个角色的火力带必须**同高**
   *    （离地 14.4~21.6px），否则 tables.js 里无人机的浮动区间（按人类
   *    枪口 18px 推出的 lift=0.70）对猫狗就不成立 —— 那会变成「同样的操作，
   *    猫狗打不中人类打得中的东西」，是比一条 6px 的可见性缺口严重得多的
   *    不公平。所以：头心的 y 由「吻部落在离地 18px」反推。
   *
   * ② 俯角 tilt = 0.25rad。爬行时头是低着往前探的，这个俯角有两个作用：
   *    把吻部转到头的**下方偏前**（于是头能整体抬高 2.3px），以及把耳朵
   *    向前扫过头的顶（于是碰撞盒右上角那条带子有东西挡着）。这两件事
   *    都是「量出来的覆盖」逼出来的，见 tools/diag-crawl.js 的【1c】。
   *
   * ③ 眼睛不许压到吻部（红线十二沿用五官那条判据）。俯角一大，吻部就往
   *    回缩，眼右缘立刻撞上吻部左缘 —— 0.25rad 是这条不等式的上界：
   *    吻部相对头心的 x 变成 7.10（原本 8.2），7.10 − 4.2 = 2.90 > 眼右缘 2.6。
   *    想再低头，就得把眼睛再往左挪 —— 那会把眼睛挤出脸外。
   */
  head: { x: 11, y: -23.70, r: 14 },
  tilt: 0.25,
  /* 躯干：横着的一段粗胶囊。y 与 w 也是量出来的 —— 碰撞盒里 11~27px 那一段
   * 完全靠它填满（四足的身形只有这一段是「实心」的）。 */
  body: { x1: -9, y1: -19, x2: 7, y2: -19, w: 16 },
  hip: { x: -9, y: -19 },                       // 尾巴的根
  /* 腿：{ 关节 x / y、粗细、相位、远近 }。
   * 相位写成对角两组（trot 步态）：前近 + 后远 同相，前远 + 后近 同相。
   * 两条**近**腿画在身体之上、两条**远**腿画在身体之下 —— 这是「四条腿」
   * 在侧视里唯一的空间线索；少了远近两层，四条腿会糊成两条。 */
  legs: [
    { jx: -9.0, jy: -15.5, w: 5.0, ph: 0, side: 'far' },
    { jx: 4.0, jy: -15.5, w: 5.0, ph: Math.PI, side: 'far' },
    { jx: -6.5, jy: -13.5, w: 6.5, ph: Math.PI, side: 'near' },
    { jx: 7.0, jy: -13.5, w: 6.5, ph: 0, side: 'near' }
  ],
  /* 步幅：走多少 px 腿摆一个完整来回。44px 是按移速 240px/s 定的 ——
   * 一个周期 44/240 = 0.183s ≈ 11 帧，人眼刚好能读出「有四条腿在跑」，
   * 又不会快到糊成一团。写死成时间（比如 0.2s 一个周期）是错的：
   * 那样「走得快」和「走得慢」看起来一模一样，而步态的全部意义就是
   * **让腿的摆动跟位移对上**（否则就是原地踏步）。 */
  stride: 44,
  swing: 5,          // 脚掌前后摆幅（px）
  lift: 3.5,         // 抬脚高度（px）
  tuck: 7,           // 腾空收腿（px）—— 四足腾空时爪子必须离开地面
  bob: 1.2           // 躯干起伏（px）：每半个周期一次，配合抬脚
};

/* 把「以头心为原点、按基准半径画好」的零件贴到真正的头上：
 * 按头半径缩放 →（可选）绕头心俯仰 tilt → 平移到头心。
 *
 * 旋转必须是**绕头心的整体旋转**，不能只挪吻部 —— 头和它的零件是一个刚体，
 * 低头时耳朵、胡须、鼻子一起转，只挪一个就会露出「眼睛长在额头上」那种破绽。
 * prims.place 本来就是「先缩放、再绕原点旋转、最后平移」，原点正好是头心。 */
function placeAtHead(list, head, tilt) {
  return P.place(list, head.x, head.y, head.r / PET_HEAD_UNIT, tilt || 0);
}

/* 一条腿。phase 是步态相位（弧度），airK 是离地比例（0 贴地 / 1 顶点）。
 * 三条约束都写在这儿：
 *   ① 脚掌的前后位置 = 关节 + sin(相位)×摆幅 —— 摆动由**相位**驱动，
 *      而相位由位置驱动（见 play.js），所以「走得多快腿就摆得多快」；
 *   ② 抬脚 = max(0, cos(相位))×抬脚高度 —— 只在向前摆的那半程离地，
 *      向后蹬的那半程踩实（否则像在冰上滑）；
 *   ③ 腾空时整条腿收起（-tuck），爪子离开地面 —— 跳起来还戳着地最难读。 */
function crawlLeg(leg, pal, phase, airK, by) {
  var a = phase + leg.ph;
  var pawX = leg.jx + Math.sin(a) * CRAWL.swing;
  var lift = Math.max(0, Math.cos(a)) * CRAWL.lift;
  var pawY = -((1 - airK) * lift + airK * CRAWL.tuck);
  var color = leg.side === 'near' ? pal.fur : pal.furDark;
  return P.capsule(leg.jx, leg.jy + by, pawX, pawY, leg.w, 'leg', color);
}

/* 爬行姿态的完整图元。绘制顺序即空间顺序（由远及近）：
 *   远侧腿 → 尾巴 → 躯干 → 头 → 头部件 → 近侧腿
 * 近侧腿画在最后，所以前腿会盖住下巴与胸口 —— 这正是四足侧视该有的遮挡。 */
function crawlFigures(fighter, hero, anim) {
  var A = anim || {};
  var pal = fighter.palette;
  var phase = A.phase || 0;
  var airK = A.airK == null ? 0 : Math.max(0, Math.min(1, A.airK));
  var moving = !!A.moving;
  /* 起伏：动的时候每半个周期一次（配合左右脚交替着地），站着不动时只剩
   * 一点呼吸 —— 完全不动会像一具标本，动得和走路一样多会像在原地踏步。 */
  var by = moving ? Math.sin(phase * 2) * CRAWL.bob
    : Math.sin((A.t || 0) * 2.2) * CRAWL.bob * 0.4;

  var L = [];
  for (var i = 0; i < CRAWL.legs.length; i++) {
    if (CRAWL.legs[i].side === 'far') L.push(crawlLeg(CRAWL.legs[i], pal, phase, airK, by));
  }

  if (typeof fighter.tail === 'function') {
    var tail = fighter.tail(pal, { x: CRAWL.hip.x, y: CRAWL.hip.y + by }, 'crawl');
    for (i = 0; i < tail.length; i++) L.push(tail[i]);
  }

  L.push(P.capsule(CRAWL.body.x1, CRAWL.body.y1 + by,
    CRAWL.body.x2, CRAWL.body.y2 + by, CRAWL.body.w, 'torso', pal.fur));

  var head = { x: CRAWL.head.x, y: CRAWL.head.y + by, r: CRAWL.head.r };
  var headPrim = P.circle(head.x, head.y, head.r, 'head', pal.fur);
  /* head.rot = 俯角，**只给渲染器看**：眼睛不在图元列表里（渲染器自己画），
   * 所以头部零件整体旋转时眼睛不会跟着转 —— 把角度写在头图元上，
   * 蜡笔风把眼偏移用同一个角度转过去（见 cartoon.drawFace），像素/3D 风不读
   * 这个字段也不受影响（眼睛本来就是两个方块/一个高光，转不转读不出差别）。
   * 这不是图元词汇的新成员 —— 它挂在 head 这个已有图元上，边界检查不认识它
   * 也不需要认识。 */
  headPrim.rot = CRAWL.tilt;
  L.push(headPrim);

  var headParts = (typeof fighter.parts === 'function')
    ? placeAtHead(fighter.parts(pal), head, CRAWL.tilt) : [];
  for (i = 0; i < headParts.length; i++) L.push(headParts[i]);

  for (i = 0; i < CRAWL.legs.length; i++) {
    if (CRAWL.legs[i].side === 'near') L.push(crawlLeg(CRAWL.legs[i], pal, phase, airK, by));
  }
  return L;
}

/* ---------------------------------------------------------------------------
 * 角色档案 —— 菜单里可选的三个角色
 * palette 的键与 HERO.palette 完全一致（渲染器不需要为宠物写第二套取色逻辑），
 * 另外补了宠物专用的 fur / belly / inner / nose / furEdge；
 * 人类这五个键为 null，渲染器用 `pal.fur || pal.suit` 天然回退。
 * speciesGeom 必须与 l1-engine 的 SLOTS.petSpecies.variants[].geom 逐字段相同，
 * tests/run.js 直接读 l1-engine.js 比对，防止「照片判成猫、但打的是骨头」。
 * -------------------------------------------------------------------------*/
var FIGHTERS = {
  human: {
    id: 'human', labelKey: 'fighter.human', species: null, bullet: 'pellet',
    blurbKey: 'fighter.human.blurb',
    palette: {
      skin: '#F2C9A0', skinShade: '#D9A87C', hair: '#2A2620',
      suit: '#FF5A3C', suitDark: '#C9412B', accent: '#2ED8A7',
      gun: '#3A3F4B', outline: '#12111A',
      fur: null, belly: null, inner: null, nose: null, furEdge: null
    },
    speciesGeom: { snout: null, whisker: 0, nose: 0.70, bullet: 'pellet' },
    /* 人类：直立骨架 + 一把枪，弹从**枪口**出来。
     * fire 是「弹从哪儿生出来」（脚底原点、朝向 +x），原来是写死在 play.js
     * 里的 `p.x + 30, p.y - 18`；搬到角色档案是为了让宠物能改用「嘴」，
     * 而人类的位置一个像素都没动。 */
    pose: 'upright', fire: { x: 30, y: -18 },
    parts: function () { return []; }, tail: null
  },

  cat: {
    id: 'cat', labelKey: 'fighter.cat', species: 'cat', bullet: 'fishbone',
    blurbKey: 'fighter.cat.blurb',
    palette: {
      skin: '#FFF1DC', skinShade: '#E8D6BB', hair: '#C97F2E',
      suit: '#F0A94E', suitDark: '#C97F2E', accent: '#2ED8A7',
      gun: '#3A3F4B', outline: '#2A1B0C',
      fur: '#F0A94E', furDark: '#C97F2E', furEdge: '#7A4A16',
      belly: '#FFF1DC', inner: '#F58A9B', nose: '#F58A9B'
    },
    speciesGeom: { snout: 0.62, whisker: 1, nose: 0.55, bullet: 'fishbone' },
    /* 爬行：四足着地，弹从**嘴**里吐出来。
     * fire 落在吻部圆内（距离吻心 1.08px < 吻半径 3.88），y 与人类枪口
     * 逐像素相同 —— 这两条是红线十二在守的：前者是「看起来从嘴里出来」，
     * 后者是「三个角色的火力带同高，无人机落下来时谁都打得中」。 */
    pose: 'crawl', fire: { x: 18.7, y: -18 },
    parts: catParts, tail: catTail
  },

  dog: {
    id: 'dog', labelKey: 'fighter.dog', species: 'dog', bullet: 'bone',
    blurbKey: 'fighter.dog.blurb',
    palette: {
      // 红线教训：belly（吻部）曾经用 #FFFFFF 压在 fur #F2EEE6 上 —— 白对白，
      // 4× 放大下整张狗脸糊成一团浅色斑。吻部必须比毛色深至少一档（暖米色），
      // 耳内/舌头的粉也要够深，垂耳的层次才读得出来。
      // furDark 由灰褐 #B9B0A0 改暖棕 #C4A470：灰褐的垂耳在 4× 目检里
      // 是「脸上的灰斑」，暖棕才读成「耳朵」—— 颜色语义也是造型的一部分。
      skin: '#FFFFFF', skinShade: '#E0D8C8', hair: '#CFC7B6',
      suit: '#F2EEE6', suitDark: '#CFC9BC', accent: '#2ED8A7',
      gun: '#3A3F4B', outline: '#3A3830',
      fur: '#F2EEE6', furDark: '#C4A470', furEdge: '#6E675C',
      belly: '#E8D2A8', inner: '#D89A84', nose: '#2A2620'
    },
    speciesGeom: { snout: 1.00, whisker: 0, nose: 0.80, bullet: 'bone' },
    pose: 'crawl', fire: { x: 19.1, y: -18 },
    parts: dogParts, tail: dogTail
  }
};

/* 菜单里的固定顺序 —— 人类排第一，因为它是「没识别出宠物」时的默认角色 */
var FIGHTER_ORDER = ['human', 'cat', 'dog'];

/* L1 引擎判出的 species → 可玩角色。
 * 关键：'unknown' 与 null 都回退到人类，绝不硬猜 —— 这与 L1 里
 * 「两个物种都被否决就报 unknown」是同一个态度：宁可没有宠物，不可认错宠物。 */
function fighterFor(species) {
  if (species === 'cat') return FIGHTERS.cat;
  if (species === 'dog') return FIGHTERS.dog;
  return FIGHTERS.human;
}

function fighterById(id) { return FIGHTERS[id] || FIGHTERS.human; }

/* 完整角色图元 = 骨架 + 物种专属部件。颜色在这里从 palette 注入 —— 两者同源。
 *
 * anim（第三个参数，可选）：{ phase, moving, airK, t }，**只对爬行姿态有意义**。
 * 不传就是「静止的第一帧」—— 三画风验证台、五官特写、L1 演示页走的都是这一支。
 *
 * 为什么动画数据要经过这里、而不是让三个渲染器各算一遍：
 *   渲染器契约里没有「步态」这个词，也不该有。腿摆到哪儿是**几何**，
 *   三套皮必须画出同一个动作（否则「切画风不改变玩法」这条红线立刻破功：
 *   像素风的猫在跑、蜡笔风的猫在滑）。所以相位 → 坐标这一步留在数据层。 */
function fighterFigures(fighter, hero, anim) {
  var f = fighter || FIGHTERS.human;
  var h = hero || HERO;
  if (f.pose === 'crawl') return crawlFigures(f, h, anim);
  var base = heroFigures(h);
  var extra = [];
  if (typeof f.parts === 'function') {
    extra = extra.concat(placeAtHead(f.parts(f.palette), h.bones.head));
  }
  if (typeof f.tail === 'function') extra = extra.concat(f.tail(f.palette, null, 'upright'));
  return base.concat(extra);
}

/* 通用骨架图元：三种画风各自解释同一个 role，但几何来自同一份定义。
 * role 约定：head / torso / arm / leg / gun —— 渲染器按 role 决定怎么画，
 * 但绝不因为画风不同而改碰撞盒。
 * 返回的是 src/data/prims.js 的标准图元（带 t 字段），与宠物部件、敌人、
 * 子弹用的是同一套词汇 —— 渲染器只需要会画四种图元，不需要认识第五种格式。 */
function heroFigures(hero) {
  var b = (hero || HERO).bones;
  var L = [];
  // 顺序即绘制顺序：后腿 → 前腿 → 躯干 → 后臂 → 头 → 枪 → 前臂（由远及近）
  L.push(P.capsule(b.legBack.x, b.legBack.y,
    b.legBack.x + Math.cos(b.legBack.angle) * b.legBack.len,
    b.legBack.y + Math.sin(b.legBack.angle) * b.legBack.len, 6, 'leg'));
  L.push(P.capsule(b.legFront.x, b.legFront.y,
    b.legFront.x + Math.cos(b.legFront.angle) * b.legFront.len,

 *   实测二：子弹穿过身体需要 (碰撞盒宽 26 + 子弹宽 12) / 弹速，
 *           炮台弹 0.211s；而无敌帧只有 0.16s。子弹穿身时不会被消耗
 *           （没命中就不销毁），所以无敌帧一失效它还在身体里 → 必中。
 *           13 种起手时机实测，13 次全被打中。
 *   实测三：翻滚穿过冲锋兵时 hp 3 → 1 —— 接触伤害那一段**根本没读 invuln**。
 *
 * 于是这一版的修法分别是：
 *   翻滚 · 无敌帧按不等式定长（≥ 子弹穿身时间，见 figure.HERO.dash 注释）
 *   翻滚 · 撞上来的子弹被撞飞，而不是从身上穿过去再结算
 *   翻滚 · 接触伤害也认无敌帧（自爆兵照炸，只是不伤你）
 *   跳跃 · 新增唯一的纵向位移手段 —— 这才是躲水平弹幕的正确工具
 *   跳跃 · 地面阴影 + 挤压拉伸，让「他现在在空中」这件事看得见
 * ==========================================================================*/

var registry = require('../render/registry');
var figure = require('../data/figure');
var tables = require('../data/tables');
var level = require('../data/level-01');
var bulletShapes = require('../data/bullet-shapes');
var enemyData = require('../data/enemies');
var P = require('../data/prims');
var input = require('../core/input');
var layout = require('../core/layout');
var env = require('../adapter/env');
var audio = require('../adapter/audio');
var portal = require('../adapter/portal');
var i18n = require('../data/i18n');

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ── 公平红线：看不见的敌人，既打不到、也不开枪 ──────────────────────────────
 * 「完全入场」= 整个碰撞盒都进到屏幕里了（右缘不再压在屏幕外）。
 *
 * 这条规则是量出来的，不是拍脑袋的：接上真实输入后我实测了 16 秒，
 * 敌人出生在 x=410（屏宽 390），**死在 x=388~401** —— 也就是它刚在屏幕边缘
 * 露出几个像素就被打死了；存活时长中位数 0.71s，最短 0.08s。
 * 玩家的体感就是「小怪根本看不见，屏幕上只剩击杀数在涨」。
 *
 * 根因不是渲染，是判定：子弹飞过屏幕右缘后仍然参与命中，而自动开火是不间断的，
 * 所以敌人一跨过阈值就同时吃到好几发在途子弹。把「可被伤害」和「可开火」
 * 都绑到「完全入场」上，这类静默失效在结构上就不可能再发生。 */
function fullyEntered(en, view) {
  return en.x + en.def.w / 2 <= view.w;
}

/* 跳跃顶点（px）。由数据推出来，不另写一个魔数 —— 渲染的拉伸比例、
 * 阴影的浓淡、以及 tests/run.js 的「跳跃够不够高」都要用它。 */
function jumpApexOf(H) { return H.jumpVelocity * H.jumpVelocity / (2 * H.gravity); }

/* 输入缓冲（秒）。「翻滚 / 跳跃」的意图在**条件暂时不满足**时不死掉，
 * 而是在这里挂一小会儿，条件一满足立刻兑现。
 *
 * 为什么必须有：引擎每帧无条件清空意图队列，而翻滚要求「贴地」、跳跃要求
 * 「在地面上」，这两个条件是在帧**末尾**的重力积分里才确定的。于是**落地那一帧
 * 按翻滚，请求会被当成无效输入丢掉** —— 玩家眼看脚沾地就按，游戏说「没这回事」。
 * 实测（tools/diag-cd.js）：在「落地帧及更早」的 40 种按下时机里，请求 100% 被吞；
 * 只有「落地后第 1 帧」以后才生效。这才是「跳跃落地后不能立即翻滚」的真正原因，
 * 和冷却本身没有半点关系 —— 冷却只是在地上又加了 0.051s 的硬直，让这件事雪上加霜。
 *
 * 0.15s ≈ 9 帧。取这个量级的理由：人的按键抖动在 50~100ms 量级，缓冲要盖得住；
 * 同时不能长到「半秒前按的那一下突然冒出来」—— 那样玩家会觉得角色自作主张。
 * 格斗游戏的标准做法就是这个数（5~10 帧）。
 *
 * 缓冲放在玩法层、按**游戏时间**计时，不放在 input.js 里按 Date.now() 计时：
 * 单测是同步跑完整局的，真实时间几乎没走，按真实时间算的窗口永远不过期 ——
 * 上一轮双击判定就是这么被测试骗过一次的。 */
var IO_BUFFER = 0.15;

module.exports = {
  init: function (scenes) { this.scenes = scenes; },

  enter: function (p) {
    p = p || {};
    var H = figure.HERO;
    this.style = p.style || 'pixel';
    this.tier = p.tier || 'mid';
    this.lowDetail = this.tier === 'low';
    // 角色：菜单显式指定 > 依赖 L1 引擎判出的 species > 默认人类
    this.fighter = p.fighterId ? figure.fighterById(p.fighterId)
      : figure.fighterFor(p.species);
    this.species = this.fighter.species;
    this.bulletLook = this.fighter.bullet;      // 猫 → fishbone，狗 → bone
    this.t = 0;
    this.score = 0;
    this.kills = 0;
    this.gameOver = false;
    this.toast = null;
    /* 历史最高分。在 enter 里读**一次**就够 —— 一局之内没有任何地方会改它。
     * `|| 0` 不是多余的：env.storageGet 在键不存在时返回 fallback（这里是 0），
     * 但玩家存档里被写进过 null/NaN 时也会原样返回，而 NaN 会让
     * `score > best` 永远为 false —— 那是一个「永远破不了纪录」的静默故障。 */
    this.best = env.storageGet('ps.best', 0) || 0;
    this.newBest = false;

    /* 进入关卡 = 玩家开始玩了。门户靠这一对事件算时长和留存，少了它后台
     * 只看得见「有人加载了游戏」，看不见「有没有人玩」。
     * 重复调用由 portal 的顺序守卫吞掉 —— 结算页重开、切后台回来都会走到
     * 这里，靠调用点自觉是最容易静默出错的地方。 */
    portal.gameplayStart();

    this.player = {
      x: 60, y: layout.view().h * (level.groundY || 0.62),
      vx: 0, vy: 0,
      onGround: true,
      hp: 3, maxHp: 3,
      dashT: 0, dashCd: 0, dashDir: 1, facing: 1,
      /* 输入缓冲剩余时间（见 IO_BUFFER）。0 = 没有挂起的意图。 */
      dashBuf: 0, jumpBuf: 0,
      fireT: 0,
      invuln: 0,
      /* 贴地累计位移（px）。**步态相位的唯一来源**，不是时间。
       *
       * 为什么必须是位移而不是「跑一个 0.2s 的循环」：相位由时间驱动时，
       * 站着不动和全速狂奔会看到**一模一样**的腿 —— 那是原地踏步，不是走路。
       * 走路这件事的全部信息就是「腿的摆动跟着位移走」，所以这里存的是
       * 走过的距离，play.render 里除以 CRAWL.stride 再乘 2π 得到相位。
       *
       * 只在**贴地**时累加：腾空时四条腿整条收起（airK → tuck），此时再推进
       * 相位没有意义，反而会让落地那一帧的相位凭空跳一格。 */
      stride: 0
    };
    this.bullets = [];
    this.enemies = [];
    this.sparks = [];
    /* 技能状态。三个字段各司其职，不要合并：
     *   casts   已释放次数 —— **进化的唯一来源**（等级是它的函数，见 skillLevel）
     *   charge  这一发充能走了多少秒
     *   charged 是否已就绪（充能满、还没放出去）
     *   holdT   就绪之后又过了多久 —— 到 autoAfter 还没人按就自动放（防呆，见 figure.skill）
     * 场上正在飞的屏障放 barriers：它是一条独立推进的墙，不是玩家的属性。 */
    this.skill = { casts: 0, charge: 0, charged: false, holdT: 0 };
    this.barriers = [];
    this.spawnIdx = 0;
    this.scrollX = 0;
    this.weapon = tables.WEAPONS[level.weapon];
    this.levelTime = 0;
  },

  /* ── 子弹 ────────────────────────────────────────────────────────────────
   * 碰撞盒从**图元本身**的包围盒算出来，且只在生成时算一次（子弹不旋转）。
   * 这样「打击盒 = 看得见的形状」是结构保证，不是靠人工对齐两处数字。 */
  spawnBullet: function (x, y, vx, vy, look, hostile, damage) {
    var pr = bulletShapes.prims(look, 0, 0, vx, vy, 1);
    var b = bulletShapes.bounds(pr);
    this.bullets.push({
      x: x, y: y, vx: vx, vy: vy,
      look: look, hostile: !!hostile, damage: damage,
      hw: Math.max(1.5, b.w / 2), hh: Math.max(1.5, b.h / 2)
    });
  },

  bulletBox: function (b) {
    return { x: b.x - b.hw, y: b.y - b.hh, w: b.hw * 2, h: b.hh * 2 };
  },

  boxOf: function (en) {
    return enemyData.box(en.type, en.x, en.y, en.def);
  },

  /* 玩家的碰撞盒。写成方法而不是到处内联，是因为它原本在**三处**各写了一遍
   * （子弹命中 / 接触伤害 / 后续新增的判定），任何一处漏改都会让「看得见的
   * 形状 = 打击盒」这条不变式在那一处悄悄失效。 */
  playerBox: function (p) {
    var c = figure.HERO.collision;
    return { x: p.x - c.w / 2, y: p.y - c.h, w: c.w, h: c.h };
  },

  /* 跳跃顶点（px）：由数据推出来，渲染与测试共用同一个推导。 */
  jumpApex: function () { return jumpApexOf(figure.HERO); },

  /* 「这一帧玩家免伤吗」—— 只此一处判断。
   * 曾经的问题是这句话被写在了子弹分支里，接触伤害分支根本没写，
   * 于是翻滚穿过敌人照样全额掉血；把判断收成一个函数，新加的判定
   * 想漏都难（tests/run.js 对子弹和接触两条路径各有断言）。 */
  invulnerable: function (p) { return p.invuln > 0 || p.dashT > 0; },

  /* ── 技能等级 ────────────────────────────────────────────────────────────
   * 等级是**释放次数的纯函数**，不另存一个 level 字段。
   * 存两份必然对不上：改了进化规则（比如每 3 次升一级），level 那份就是陈旧副本，
   * 而且这种不一致不会报错 —— 只会让「打了 6 次还是 Lv1」变得无法解释。
   * 这也让「进化」这件事在测试里可以只验一个纯函数。 */
  skillLevel: function () {
    var s = figure.HERO.skill;
    return Math.min(s.levels.length, 1 + Math.floor(this.skill.casts / s.castsPerLevel));
  },

  /* 当前等级的技能参数（只读） */
  skillCfg: function () {
    return figure.HERO.skill.levels[this.skillLevel() - 1];
  },

  /* ── 放出一道屏障 ────────────────────────────────────────────────────────
   * 屏障从**屏幕左缘之外**生成 —— 起点是 x = −w，也就是它的右边缘正好压在
   * 屏幕左沿上。这样第一帧就能看见它「从画面外挤进来」，而不是凭空出现在
   * 屏幕中间；终点靠不等式①保证（speed × life ≥ 屏宽 + w，见 figure.skill）。 */
  castSkill: function () {
    var s = figure.HERO.skill;
    var before = this.skillLevel();
    var cfg = s.levels[before - 1];
    this.skill.casts++;
    this.skill.charge = 0;
    this.skill.charged = false;
    this.skill.holdT = 0;
    this.barriers.push({
      x: -cfg.w, w: cfg.w, speed: cfg.speed, life: cfg.life,
      age: 0, lvl: before
    });
    var after = this.skillLevel();
    if (after > before) {
      this.toast = { text: i18n.t('skill.upgraded', { n: after }), t: 2.0 };
      /* 进化那一帧**只播进化音**，不叠技能音。
       * 两者都是从低到高扫的三角波，叠在一起会互相打架（同相抵消、异相削顶），
       * 听感反而不如单独一个清楚。进化音本来就是技能音的加强版 ——
       * 它自己就把「这一次不一样」说完了。 */
      audio.play('levelup');
    } else {
      audio.play('skill');
    }
  },

  /* 屏障的判定盒：**整屏高**的一条竖墙。
   * 不做成「人物那么高」是需求决定的 —— 要清的是「可见画面中的**所有**小怪」，
   * 而无人机在离地十几到五十几 px 之间飘（tables.ENEMIES.drone.hover）。
   * 只画到胸口高度，它就会从墙上面飞过去。 */
  barrierBox: function (bar, view) {
    return { x: bar.x - bar.w / 2, y: 0, w: bar.w, h: view.h };
  },

  addSparks: function (x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + this.t;
      var sp = 90 + (i % 3) * 40;
      this.sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0.3, color: color });
    }
  },

  update: function (dt) {
    if (this.gameOver) return;
    this.t += dt;
    this.levelTime += dt;
    this.scrollX += level.scrollSpeed * dt;
    if (this.toast) {
      this.toast.t -= dt;
      if (this.toast.t <= 0) this.toast = null;
    }

    var p = this.player, H = figure.HERO;
    // 逻辑视口随横竖屏变化 —— 每帧取一次，转到头的瞬间就生效，不需要重建场景
    var view = layout.view();
    var groundY = view.h * (level.groundY || 0.62);

    /* ── 移动 / 跳跃 / 翻滚 ─────────────────────────────────────────────────
     * 两条轴，各司其职：
     *   水平 —— 走位（跟随手指）+ 翻滚（贴地突进，锁定方向，无敌）
     *   竖直 —— 跳跃（唯一的纵向位移手段）+ 重力
     *
     * 为什么必须有跳跃：敌人的子弹是**纯水平**飞行的，枪口高度又正好落在
     * 站立碰撞盒的正中间。「用左右移动躲子弹」在几何上不成立 —— 这正是
     * 「翻滚无法躲避攻击」这条反馈的根：翻滚再快也只是在子弹的那条线上滑。
     * 要离开那条线，只能靠竖直位移。
     *
     * 翻滚这里踩过一个只写不读的坑：原来只把 vx 改成 dash.speed 就收工，而
     * 下一帧开头的 `p.vx = targetVx` 立刻把它覆盖掉 —— 于是翻滚只生效一帧
     * （约 10px），dashT 从 0.16 一路倒数到 0，却**全工程没有任何地方读它**。
     * 玩家按了翻滚感觉「人没动」，而且不报错、不崩溃、测试还全绿 ——
     * 因为断言只查了 dashT > 0 这个标志位，从没查过主角到底位移了多远。
     * 现在：翻滚期间速度由 dashDir 锁死，输入改不了方向；方向固定为朝向（只前滚）。
     *
     * 水平的输入源有两种，别混为一谈：
     *   方向键 —— 一个**方向**（moveAxis），直接满速
     *   拖动   —— 一个**位置**（pointerX），按距离比例给速度
     * 键鼠端早先把方向伪装成位置（宿主每帧造一根手指往那边挪 6.5px，主角去追它），
     * 于是「追过头」成了必然：实测按住 → 反而先朝左走 1.07s / 248px。
     * 详见 tools/diag-move.js。 */
    var wantDash = input.consumeDash();     // 每帧都清空队列，绝不留到下一帧
    var wantJump = input.consumeJump();
    /* 队列只活一帧，所以进来的东西立刻转存到**缓冲**里；之后一律以缓冲为准。
     * 这一步就是「落地那一刻按下去算不算数」的分界线。 */
    if (wantDash > 0) p.dashBuf = IO_BUFFER;
    if (wantJump > 0) p.jumpBuf = IO_BUFFER;

    if (p.dashCd > 0) p.dashCd -= dt;
    if (p.dashT > 0) {
      p.dashT -= dt;
      if (p.dashT < 0) p.dashT = 0;
    }
    var rolling = p.dashT > 0;

    var targetVx = 0;
    /* 两个输入源，优先级明确：
     *   1. moveAxis（键盘 / 屏幕方向按钮）—— 给的是方向，直接满速，没有过渡
     *   2. 手指**拖动** —— 给的是位置，速度按距离比例给（离得远走得快，走到就停）
     * 方向优先：一边按着方向键一边拖动时，听方向键的。
     *
     * 拖动那一支多加了一个 `pointerSteer`：「点一下」不算转向指令。
     * 因为「点一下」正是翻滚的触发方式（双击的第二下、网页上点一下画布），
     * 让点按参与转向 ⇒ 朝哪边点就往哪边滚，「只往前滚」立刻变成空话。
     * 真机上的判据是位移阈值（> 12px 才算拖动），见 input.js。 */
    var axis = input.state.moveAxis;
    if (axis) {
      targetVx = axis > 0 ? H.moveSpeed : -H.moveSpeed;
    } else if (input.state.pointerDown && input.state.pointerSteer) {
      var dx = input.state.pointerX - p.x;
      targetVx = clamp(dx * 6, -H.moveSpeed, H.moveSpeed);
    }
    if (targetVx > 0) p.facing = 1;
    else if (targetVx < 0) p.facing = -1;

    /* 跳跃：只有站在地面上才能起跳（没有二段跳）。
     * 起跳会打断翻滚 —— 翻滚的前提是「贴地」，让它延续到空中，
     * 就会出现「翻滚无敌帧 + 空中」的飞行无敌状态，那条前提也就不成立了。
     * 判据用缓冲而不是 wantJump：离地时按下的跳跃会挂到落地那一刻兑现，
     * 这正是「提前按跳」在平台游戏里该有的手感。 */
    if (p.jumpBuf > 0 && p.onGround) {
      p.vy = H.jumpVelocity;
      p.onGround = false;
      p.dashT = 0;
      p.jumpBuf = 0;                  // 兑现即清空：一次按压只换一次动作
      /* 起跳保护：身体离地的那 2~3 帧仍然和地面弹道同高（几何必然），
       * 而「刚起跳就被打」是最像 bug 的一种不公平。取 max 而不是直接赋值 ——
       * 刚挨过打时有 0.8s 受击无敌，直接写会把那段**缩短**（翻滚踩过同样的坑）。 */
      p.invuln = Math.max(p.invuln, H.jumpGuard);
    }

    if (rolling) {
      p.vx = p.dashDir * H.dash.speed;      // 整个翻滚期间速度被锁住
    } else {
      p.vx = targetVx;
      // 翻滚同样只在贴地时可用：空中翻滚 = 无敌飞行
      if (p.dashBuf > 0 && p.dashCd <= 0 && p.onGround) {
        p.dashBuf = 0;                // 兑现即清空
        p.dashT = H.dash.time;
        p.dashCd = H.dash.cooldown;
        // 取 max，不是直接赋值：刚挨打时有 0.8s 受击无敌，直接赋值会把它**缩短**
        // 成 0.30s —— 按一下翻滚反而更容易再挨一下，是最反直觉的那种坑。
        p.invuln = Math.max(p.invuln, H.dash.iframes);
        /* 翻滚**只往前**：方向取当前朝向，不取「输入指着哪边」。
         *
         * 坦白说，在「点按不算转向」修好之后，这一行与原来的
         * `targetVx 的符号，没有输入才用 facing` 是**等价的** —— 因为 facing 本来
         * 就只在真的要走位时才变。改写成 facing 的价值是把规则写明白：
         * 翻滚的前后由**朝向**决定，与手指在哪、刚点了哪里无关。
         * 反过来说，「翻滚能朝背后滚」这个现象的真正开关不在这里，而在输入层
         * 把「点一下」当成了转向指令（见 input.js 的 pointerSteer）。 */
        p.dashDir = p.facing;
        p.vx = p.dashDir * H.dash.speed;
        p.vy = 0;
      }
    }
    var xBefore = p.x;
    p.x += p.vx * dt;
    p.x = clamp(p.x, 20, view.w - 20);
    /* 步态位移取**实际走过的距离**，不是 |vx|×dt。
     * 差别只在贴着屏幕边缘的那几帧：那时速度还在、人已经不动了 —— 用速度算，
     * 猫会一边撞着墙一边疯狂刨地。取实际位移则自动停住（腿也停住）。 */
    if (p.onGround) p.stride += Math.abs(p.x - xBefore);

    /* 缓冲倒计时放在两个分支之后：这样「本帧刚进来的请求」一定能被本帧的分支看到，
     * 不会因为 dt 比缓冲还长（卡顿帧）而在同一帧里失效。
     * 另外注意缓冲是**单调递减、不被未满足的条件重置** —— 否则站在空中狂按，
     * 缓冲会被自己不断续期，落地那一刻反而变成「无限记忆」。 */
    if (p.dashBuf > 0) p.dashBuf = Math.max(0, p.dashBuf - dt);
    if (p.jumpBuf > 0) p.jumpBuf = Math.max(0, p.jumpBuf - dt);

    /* 竖直：贴地时跟着地面走（转屏会改变地面高度），离地才走重力积分。 */
    if (p.onGround) {
      p.y = groundY;
    } else {
      p.vy += H.gravity * dt;
      p.y += p.vy * dt;
      if (p.y >= groundY) {
        p.y = groundY; p.vy = 0; p.onGround = true;
        /* 落地保护：与起跳保护配对。实测「见弹就跳」的挨打**全部发生在地面**
         * —— 玩家的时机误差大多表现为「跳早了，落地那一下子弹才到」，
         * 这是最后 2~3 帧的几何窗口在罚人，不是玩家操作错。 */
        p.invuln = Math.max(p.invuln, H.jumpGuard);
      }
    }

    /* ── 自动开火：弹型与**出膛点**都来自角色档案 ──────────────────────────
     *   人类 = 枪口 (30,-18)　猫 = 吻部 (18.7,-18)　狗 = 吻部 (19.1,-18)
     *
     * 这一行原来是写死的 `p.x + 30, p.y - 18` —— 那是**人类枪口**的位置。
     * 猫狗照样从这里出弹，于是「鱼骨从猫嘴里吐出来」变成「猫头顶右侧
     * 凭空冒出一根鱼骨」。出膛点是**造型的一部分**（枪口 / 嘴），所以它和
     * 弹型、配色一样归角色档案管，而不是玩法层。
     *
     * 三个角色的 y **必须逐像素相同**（都是 -18）：tables.js 里无人机的
     * hover.lift = 0.70 是按「玩家的火力带在离地 14.4~21.6px」推出来的。
     * 猫狗若比人类低一档，就会出现「同样的操作，猫打不中人类打得中的东西」——
     * 那比一条 6px 的可见性缺口严重得多。tests/run.js 红线十二锁这一条。 */
    p.fireT -= dt;
    if (p.fireT <= 0) {
      p.fireT = this.weapon.interval;
      var muzzle = this.fighter.fire || figure.FIGHTERS.human.fire;
      for (var k = 0; k < this.weapon.pellets; k++) {
        var spread = (k - (this.weapon.pellets - 1) / 2) * this.weapon.spread;
        this.spawnBullet(
          p.x + muzzle.x, p.y + muzzle.y,
          Math.cos(spread) * this.weapon.bulletSpeed,
          Math.sin(spread) * this.weapon.bulletSpeed,
          this.bulletLook, false, this.weapon.damage
        );
      }
      /* 音效放在**循环之外**：spread 枪一帧出 3 颗弹，放进循环就得靠节流去重。
       * 用兜底掩盖设计意图的写法，后面的人改枪械参数时一定会踩。
       * 「一次开火 = 一声」这句话直接写在这儿，比让读者去查 MIN_GAP 强。 */
      audio.play('fire');
    }

    /* ── 刷怪：按关卡时间表，与画风无关 ── */
    while (this.spawnIdx < level.waves.length && level.waves[this.spawnIdx].t <= this.levelTime) {
      var w = level.waves[this.spawnIdx++];
      var et = tables.ENEMIES[w.type];
      if (!et) continue;
      // en.y 是碰撞盒**底边**（= 落脚点），所以地面敌人直接放 groundY；
      // 会飞的按 hover.lift 抬高，再靠正弦在上下浮动。
      //
      // 这里原来写的是 `et.h * 1.6` —— 一个**没有任何推导**的魔数，而且全工程
      // 只此一处（其余每个数值都写了不等式）。它的后果是量出来的：无人机的
      // 碰撞盒被抬到离地 33.6~75.6px，而玩家的站立火力带是 14.4~21.6px ——
      // 两条带中间空着 12px，于是**站立火力永远打不到无人机**（8 个相位 ×180 帧，
      // 命中 0 发），跳起来的窗口又只有 0.117s < 开火间隔 0.30s。
      // 实战：40.3s 死，期间刷了 2 只无人机、打掉 0 只。
      // 现在 lift 由「盒底要摆过玩家的火力带」这条不等式推出来，写在 tables.js
      // 的 drone.hover 注释里，并由 tests/run.js 红线十按真实枪口高度重算。
      var baseY = groundY;
      if (et.hover) baseY -= et.h * et.hover.lift;
      for (var n = 0; n < w.count; n++) {
        this.enemies.push({
          type: w.type, def: et,
          x: view.w + 20 + n * (et.w + 14),
          y: baseY, baseY: baseY,
          hp: et.hp, maxHp: et.hp,
          // 首次开火延迟必须小于「玩家击杀它所需的时间」，否则敌人永远开不出枪。
          // 这个约束的推导见 tables.FIRE_GRACE 的注释，并由 tests/run.js 逐类型校验。
          fireT: tables.FIRE_GRACE + n * tables.FIRE_GRACE_STEP,
          burstLeft: (et.burst || 1) - 1,
          seed: (this.spawnIdx * 3 + n) * 0.9,
          hurt: 0
        });
      }
      if (w.introKey) this.toast = { text: i18n.t(w.introKey), t: 3.0 };
    }

    /* ── 子弹推进与命中 ── */
    for (var i = this.bullets.length - 1; i >= 0; i--) {
      var b = this.bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < -30 || b.x > view.w + 30 || b.y < -40 || b.y > view.h + 40) {
        this.bullets.splice(i, 1); continue;
      }
      var bbox = this.bulletBox(b);
      if (b.hostile) {
        if (aabb(bbox, this.playerBox(p))) {
          if (p.dashT > 0) {
            /* 翻滚中撞上来的子弹被**撞飞**（销毁 + 火星），而不是穿身而过。
             *
             * 这一行是「翻滚躲得掉攻击」的关键。原来只是靠无敌帧：子弹打不到你，
             * 于是条件不成立、子弹也**不销毁**，它继续往前飞、仍然停在你身体里；
             * 无敌帧一到期，同一颗子弹立刻结算伤害。玩家的体感就是
             * 「明明翻滚躲过去了，血还是掉了」。现在翻滚把子弹直接吃掉。 */
            this.bullets.splice(i, 1);
            this.addSparks(b.x, b.y, '#FFE066', 4);
            continue;
          }
          if (p.invuln <= 0) {
            this.bullets.splice(i, 1);
            this.hitPlayer(b.damage);
          }
        }
      } else {
        for (var j = this.enemies.length - 1; j >= 0; j--) {
          var e = this.enemies[j];
          if (!fullyEntered(e, view)) continue;      // 还没进屏幕的敌人不吃伤害
          if (aabb(bbox, this.boxOf(e))) {
            e.hp -= b.damage;
            e.hurt = 0.09;
            this.bullets.splice(i, 1);
            if (e.hp <= 0) this.killEnemy(j);
            /* 打死的那一下**不**再播命中音 —— 它归 killEnemy 发声。
             * 两个都播就是同一瞬间一个「嗒」叠一个「咚」，听起来像卡了一下。 */
            else audio.play('hit');
            break;
          }
        }
      }
    }

    /* ── 敌人 AI：推进 + 浮动 + 点射/连发 + 接触伤害 ── */
    for (var m = this.enemies.length - 1; m >= 0; m--) {
      var en = this.enemies[m];
      en.x -= en.def.speed * dt;

      // 会飞的按正弦上下浮动 —— 碰撞盒跟着走，「子弹是三维的」才成立
      if (en.def.hover) {
        en.y = en.baseY + Math.sin(this.levelTime * en.def.hover.freq + en.seed) * en.def.hover.amp;
      }
      if (en.hurt > 0) en.hurt -= dt;

      // 开火：burst > 1 的敌人打出连发（炮台/精英），子弹从**枪口**出而不是身体中心。
      // 计时器也要等敌人完全入场才开始走 —— 「看不见的敌人不开冷枪」和
      // 「看不见的敌人打不到」是同一条规则的两半，缺一半就是不公平。
      if (en.def.fireInterval > 0 && fullyEntered(en, view)) {
        en.fireT -= dt;
        if (en.fireT <= 0 && this.levelTime > 1.0) {   // 关卡头 1 秒不开火，避免开场就被打冷枪
          var mz = enemyData.muzzle(en.type, en.x, en.y) || { x: en.x, y: en.y - en.def.h * 0.5 };
          this.spawnBullet(mz.x, mz.y, -en.def.bulletSpeed, 0,
            en.def.bullet || 'hostile', true, en.def.bulletDamage);
          if (en.burstLeft > 0) {
            en.burstLeft--;
            en.fireT = en.def.burstGap || 0.12;
          } else {
            en.burstLeft = (en.def.burst || 1) - 1;
            en.fireT = en.def.fireInterval;
          }
        }
      }

      /* 接触伤害。这里必须也认无敌帧 —— 原来只有子弹分支写了 invuln 判断，
       * 这一支完全没有，于是「翻滚穿过敌人」这条最典型的用法每次都要付全额
       * 接触伤害（实测翻滚穿过冲锋兵：hp 3 → 1）。翻滚的意义就是穿过，
       * 穿过去还要掉血，那这个动作就白做了。
       *
       * 自爆兵（runner）照炸：它的机制是「碰到即消失」，撞上就该爆，
       * 爆了会不会伤到你是另一回事。 */
      if (aabb(this.playerBox(p), this.boxOf(en))) {
        if (!this.invulnerable(p)) this.hitPlayer(en.def.contactDamage);
        if (en.type === 'runner') { this.addSparks(en.x, en.y - en.def.h / 2, '#FFB02E', 6); this.enemies.splice(m, 1); }
      }
      if (en.x < -60) this.enemies.splice(m, 1);
    }

    /* ── 可进化技能：充能 → 就绪 → 释放 ────────────────────────────────────
     * 三段式，每段只做一件事：
     *   充能中 —— 按 dt 累加；到 charge 秒就转「就绪」
     *   就绪   —— 等玩家按；按了就放。若 autoAfter 秒还没人按，**自动放**
     *             （为什么必须有这一条：figure.skill 里那段 —— 攒着不放的
     *             打法实测和完全不放一个样，技能等于不存在）
     * 放在「敌人 AI」之后是刻意的：屏障清场用的是**这一帧敌人移动后**的位置，
     * 所以「小怪正好走进墙里」那一帧就会被抹掉，而不是等下一帧。 */
    var sk = this.skill, skDef = H.skill;
    var wantSkill = input.consumeSkill();
    if (!sk.charged) {
      sk.charge += dt;
      if (sk.charge >= this.skillCfg().charge) {
        sk.charge = this.skillCfg().charge;
        sk.charged = true;
        sk.holdT = 0;
      }
    } else {
      sk.holdT += dt;
      if (wantSkill > 0 || sk.holdT >= skDef.autoAfter) this.castSkill();
    }

    /* ── 屏障推进：扫过的「可见」小怪当场消灭 ────────────────────────────────
     * 「可见」沿用 fullyEntered 的判据（整个碰撞盒进了屏幕），不是「与屏幕相交」。
     * 需求说的是「当前可见画面中的」—— 屏幕右缘外那半只身位还没入场的敌人，
     * 玩家看不见它，被清掉只会让人以为「右边有一只凭空消失了」。
     * 这一条与「看不见的敌人打不到、也不开冷枪」是同一条规则的第三处落点。 */
    for (var bi = this.barriers.length - 1; bi >= 0; bi--) {
      var bar = this.barriers[bi];
      bar.age += dt;
      bar.x += bar.speed * dt;
      var barBox = this.barrierBox(bar, view);
      for (var ei = this.enemies.length - 1; ei >= 0; ei--) {
        var enemy = this.enemies[ei];
        if (!fullyEntered(enemy, view)) continue;
        if (aabb(barBox, this.boxOf(enemy))) this.killEnemy(ei, tables.PALETTE.blue);
      }
      /* 消失条件取「或」：扫出右缘 / 存活时间到。
       * 不等式①保证正常情况下是**先**扫出右缘（1120px > 870px），
       * life 是兜底 —— 万一以后有人调慢了 speed 而忘了 life，
       * 屏障会在屏幕中间凭空消失，那一眼就能看出来，而不是静默漏掉右半屏。 */
      if (bar.x - bar.w / 2 > view.w || bar.age >= bar.life) this.barriers.splice(bi, 1);
    }

    /* ── 火花 ── */
    for (var s = this.sparks.length - 1; s >= 0; s--) {
      var sp = this.sparks[s];
      sp.life -= dt;
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vy += 620 * dt;
      if (sp.life <= 0) this.sparks.splice(s, 1);
    }

    if (p.invuln > 0) p.invuln -= dt;
    if (this.levelTime >= level.duration) this.endRun();   // 骨架版：跑完即通关
  },

  /* 击杀。color 可选 —— 屏障杀怪该是蓝色火花，玩家枪杀怪是红色。
   * 默认值保持红色，所以原来所有调用点的行为一个字都没变。 */
  killEnemy: function (idx, color) {
    var en = this.enemies[idx];
    this.score += en.def.score;
    this.kills++;
    this.addSparks(en.x, en.y - en.def.h * 0.5, color || '#FF5A3C', en.type === 'elite' ? 12 : 6);
    this.enemies.splice(idx, 1);
    audio.play('kill');
  },

  /* ── 一局结束 ────────────────────────────────────────────────────────────
   * 「这局完了」的**所有**路径都必须走这里（时间到 / 血量归零）。
   * 原来那两处各自直接写 `this.gameOver = true`，于是任何「结束时该做的事」
   * 都得在两个地方各写一遍 —— 漏一处就是静默不一致，而这里要做的事
   * （写最高分）恰恰是**漏了不会报错**的那种。
   *
   * 幂等是必须的，不是防御性冗余：hp 归零的那一帧，同帧后续的判定还会再调一次。 */
  endRun: function () {
    if (this.gameOver) return;
    this.gameOver = true;
    /* 一局结束 = 一段 gameplay 结束。endRun 是死亡与通关的**唯一**出口
     * （见上面那条幂等说明），所以这里也是门户事件唯一需要接的地方。 */
    portal.gameplayStop();
    /* 结算页是门户插播广告最自然的时机 —— 玩家正处在一个「这一局完了」的
     * 停顿里，而不是被打断在半场。
     *
     * Poki 的官方口径是「不是每次 commercialBreak() 都会真的出广告，
     * 由 Poki 的系统决定玩家什么时候准备好了，所以请**尽可能多**地
     * 发出这个信号」—— 所以这里不做任何节流，也不判断「该不该出」。
     * 返回值是 Promise，但结算页本身就是静止的（gameOver 之后世界不再推进），
     * 所以不需要额外暂停主循环。
     *
     * 不写 `portal.commercialBreak().then(...)` ：后面没有任何事要做，
     * 而加一个空的 then 反而会让人以为「这里本来该做点什么」。 */
    portal.commercialBreak();
    /* 只有**真的更高**才写盘。这条让「最高分只增不减」成为结构保证，
     * 而不是靠每个调用方自觉 —— 存档一旦被写小，玩家就永远回不去那个分数，
     * 而且他只会觉得「游戏把我的记录弄丢了」。 */
    if (this.score > this.best) {
      this.best = this.score;
      this.newBest = true;
      env.storageSet('ps.best', this.best);
    }
  },

  hitPlayer: function (dmg) {
    this.player.hp -= dmg;
    this.player.invuln = 0.8;
    audio.play('hurt');
    if (this.player.hp <= 0) this.endRun();
  },

  render: function (g, view) {
    var impl = registry.get(this.style);
    var ui = registry.uiOf(this.style);
    var groundY = view.h * (level.groundY || 0.62);

    /* 背景交给渲染器 —— 蜡笔风是米白纸底，白字 HUD 会看不见，
     * 所以「背景 + UI 配色」必须由画风一起提供，而不是玩法层硬编码。 */
    registry.paintBackdrop(g, this.style, view, {
      scrollX: this.scrollX, t: this.t, groundY: groundY, level: level
    });

    var p = this.player;
    var airH = Math.max(0, groundY - p.y);          // 离地高度（px）
    var airK = clamp(airH / this.jumpApex(), 0, 1); // 0 = 贴地，1 = 跳跃顶点

    /* 步态动画数据 —— 交给数据层算「腿摆到哪儿」，而不是三个渲染器各算一遍。
     *
     * 渲染器契约里没有「步态」这个词，也不该有：猫摆几条腿、摆到哪个角度，
     * 是**几何**问题。如果让每套皮自己按时间插值，像素风的猫和蜡笔风的猫
     * 就会踩在不同的节拍上 —— 「切画风不改变玩法」这条红线立刻破功
     * （玩法没变，但玩家看到的动作变了）。
     *
     * phase 由**位移**推出来（p.stride / CRAWL.stride × 2π），所以走得快
     * 腿就摆得快、站着不动腿就停住。moving 只认「贴地且有速度」—— 腾空时
     * 腿是整条收起来的（airK），躯干不该还在左右晃。 */
    var crawl = figure.CRAWL;
    var anim = {
      phase: p.stride / crawl.stride * Math.PI * 2,
      moving: p.onGround && Math.abs(p.vx) > 1,
      airK: airK,
      t: this.t
    };

    /* 玩家：同一份 fig 数据交给当前渲染器 —— 画风切换不影响任何判定 */
    var figs = figure.fighterFigures(this.fighter, figure.HERO, anim);

    /* 地面阴影。
     * 横版 2D 里「他跳起来了」这件事必须有东西告诉玩家**离地多高、会落在哪**，

  document.documentElement.lang = (i18n.lang() === 'zh') ? 'zh-CN' : 'en';

  /* ── 1. 方向与尺寸 ──────────────────────────────────────────────────────
   * force 一次即可：这一页没有「切方向」的入口，也不需要跟着容器形状来回改。
   *
   * 用 max 而不是 min —— Poki 要的是 cover（填满），不是 contain（装下）。
   * 用 min 的话，容器比例只要跟 16:9 差一点，上下或左右就会露黑边，
   * 而那正是它明确会拒收的形态。 */
  game.layout.force('landscape');
  function fit() {
    var w = Math.max(320, window.innerWidth);
    var h = Math.max(200, window.innerHeight);
    game.relayout(w, h);
    var v = game.view;
    var s = Math.max(w / v.w, h / v.h);
    canvas.style.width = Math.round(v.w * s) + 'px';
    canvas.style.height = Math.round(v.h * s) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 60); });
  fit();

  /* ── 2. 指针 ────────────────────────────────────────────────────────────
   * 触摸不用管：input.attach 已经在浏览器里挂了 touchstart/move/end 并按
   * 画布的实际显示矩形换算坐标。
   * 鼠标必须由宿主补 —— 引擎只认触摸（真机没有鼠标），而 Poki 的主力玩家
   * 恰恰是桌面端的鼠标键盘。合成事件要自带 currentTarget：引擎用它取画布的
   * 显示矩形，这个引用平时由浏览器派发时给出。 */
  function emit(type, e) {
    var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    if (t.clientX == null) return;
    input.__emit(type, { clientX: t.clientX, clientY: t.clientY, currentTarget: canvas });
  }
  /* 双击翻滚：触屏上由 input.js 自己识别（touchstart），鼠标没有 touchstart，
   * 网页端在这里补一次同样的判定。窗口期读 input.DASH_WINDOW，不写死毫秒数。 */
  var lastDownAt = 0;
  canvas.addEventListener('mousedown', function (e) {
    grabFocus(); emit('start', e);
    var now = Date.now();
    if (now - lastDownAt < input.DASH_WINDOW) { input.requestDash(); lastDownAt = 0; }
    else lastDownAt = now;
  });
  canvas.addEventListener('mousemove', function (e) { if (input.state.pointerDown) emit('move', e); });
  canvas.addEventListener('mouseup', function (e) { emit('end', e); });
  canvas.addEventListener('mouseleave', function (e) { if (input.state.pointerDown) emit('end', e); });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('dragstart', function (e) { e.preventDefault(); });

  /* ── 3. 焦点 ────────────────────────────────────────────────────────────
   * 键盘要能用，这个 iframe 必须真的拿到焦点，而这件事在嵌入页面里**不会
   * 自动发生**。所以：加载完主动要一次（多半会被浏览器拒），之后每一次
   * 指针按下都再要一次 —— 玩家点「开始」的那一下必然生效，而键盘是在那之后
   * 才用得上的。 */
  function grabFocus() {
    try { window.focus(); } catch (e) { }
    try { canvas.focus({ preventScroll: true }); } catch (e) { }
  }

  /* ── 4. 键盘 ────────────────────────────────────────────────────────────
   * ←→/AD 移动，空格/↑ 跳跃，J 翻滚，Q/E 屏障，Enter 开始，Esc 回菜单。
   *
   * 与本地运行页最大的差别是**无条件吞掉空格与方向键**：
   * Poki 官方文档专门点出这一条，原话大意是「空格和方向键会滚动页面 ——
   * 在你的开发环境里不明显，因为游戏占满了整个窗口；但在 Poki 上，
   * 它嵌在一个可滚动的长页面里」。这条故障在本地**测不出来**，
   * 只能靠「不问游戏现在要不要这个键，先吞掉」来根治。
   * 游戏页面上没有任何需要滚动的区域，吞掉它没有任何副作用。 */
  var SWALLOW = [' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
  var keys = {};
  var KEYS_L = ['ArrowLeft', 'a', 'A'], KEYS_R = ['ArrowRight', 'd', 'D'];
  var KEYS_JUMP = [' ', 'ArrowUp', 'w', 'W'];
  var KEYS_DASH = ['j', 'J', 'Shift'];
  var KEYS_SKILL = ['q', 'Q', 'e', 'E'];
  function anyKey(list) { for (var i = 0; i < list.length; i++) if (keys[list[i]]) return true; return false; }

  window.addEventListener('keydown', function (e) {
    if (SWALLOW.indexOf(e.key) >= 0) e.preventDefault();
    var first = !keys[e.key];                 // 长按不重复触发（按住空格不该连跳）
    keys[e.key] = true;
    var sc = game.scenes.current();
    if (e.key === 'Enter' && sc && sc.name === 'menu') sc.startPlay();
    if (e.key === 'Escape' && sc && sc.name === 'play') {
      game.scenes.go('menu', { style: sc.style, tier: sc.tier, fighterId: sc.fighter ? sc.fighter.id : 'human' });
    }
    if (first && KEYS_JUMP.indexOf(e.key) >= 0) input.requestJump();
    if (first && KEYS_DASH.indexOf(e.key) >= 0) input.requestDash();
    if (first && KEYS_SKILL.indexOf(e.key) >= 0) input.requestSkill();
  });
  /* 松开方向键不用做任何事：方向每帧由 tick() 根据「现在按着哪些键」重算。 */
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });
  // 失焦时可能收不到 keyup（切标签、点外框），按键表会卡在「还按着」
  window.addEventListener('blur', function () { keys = {}; input.setMove(0); });

  /* ── 5. 帧循环：把按键折算成一个方向交给输入层 ──────────────────────────
   * 这一页没有屏幕按钮（门户玩家要么用鼠标要么用键盘，两者都接上了），
   * 所以方向只来自键盘 —— 但依然只在玩法场景里接管，菜单里按方向键
   * 不该把主角拽走。 */
  function tick() {
    var s = game.scenes.current();
    input.setMove(s && s.name === 'play'
      ? (anyKey(KEYS_R) ? 1 : 0) + (anyKey(KEYS_L) ? -1 : 0)
      : 0);
    requestAnimationFrame(tick);
  }

  /* ── 启动 ───────────────────────────────────────────────────────────────
   * 主循环立刻启动，**不等 portal.init()**。
   *
   * 取舍：Poki 推荐「init 完成后开始游戏」。但 init 取决于 SDK 脚本的下载
   * 速度，而那个脚本在弱网下可能几百毫秒才到 —— 让玩家盯着白屏等它是
   * 明确更差的选择。启动页（boot）本身有 0.6s 的进度条，加上菜单里选画风
   * 选角色的时间，init 早就完成了；而万一它没完成，portal 层的每次调用
   * 都会照常记账并在 SDK 就绪后自然生效（见 portal.js：永不抛错、
   * 无后端时静默降级）。
   *
   * 换句话说：「有没有广告」不能决定「能不能玩」—— 这一条 Poki 自己也
   * 写进了准入要求（广告被拦截时游戏必须仍可玩）。 */
  grabFocus();
  requestAnimationFrame(tick);
  game.loop.start();
})();
</script>

</body>
</html>
